<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Post Board</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
        }
        input, textarea {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #posts {
            margin-top: 20px;
        }
    </style>
    <script>
        function checkPassword() {
            const passwordInput = document.getElementById('password').value;
            const hashedInput = md5(passwordInput);
            const correctHash = "a60786a3cbf7603733575d98e7c4428a"; // MD5 for "SanSanCh@NT"

            if (hashedInput === correctHash) {
                document.getElementById('postForm').style.display = 'block';
                document.getElementById('passwordError').style.display = 'none';
            } else {
                document.getElementById('passwordError').style.display = 'block';
            }
        }

        function md5(string) {
            // Simple MD5 hashing library or function should be implemented here
            // Placeholder for actual md5 implementation
            return string; // This should be the MD5 hash of the string
        }
    </script>
</head>
<body>

    <h1>Welcome to the Protected Post Board</h1>
    <input type="password" id="password" placeholder="Enter Password" onblur="checkPassword()">
    <div id="passwordError" style="color: red; display: none;">Incorrect Password</div>

    <form id="postForm" style="display: none;">
        <textarea placeholder="Your message" required></textarea>
        <input type="file" accept="image/*">
        <button type="submit">Post</button>
    </form>

    <div id="posts">
        <!-- Posts from data folder will be displayed here -->
    </div>

</body>
</html>
