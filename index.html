<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NT-X System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { background:#000; color:#fff; font-family:sans-serif; max-width:500px; margin:0 auto; padding:10px; }
        input, textarea, button { width:100%; margin:5px 0; padding:12px; border-radius:8px; border:1px solid #333; background:#111; color:#fff; box-sizing:border-box; font-size:16px; }
        .post { border-bottom:1px solid #222; padding:15px; }
        img { width:100%; border-radius:12px; margin-top:8px; }
    </style>
</head>
<body>
    <div id="editor">
        <input type="password" id="pw" placeholder="Pass">
        <textarea id="msg" placeholder="いまどうしてる？"></textarea>
        <input type="file" id="file" accept="image/*">
        <button onclick="post()">投稿する</button>
    </div>
    <hr style="border:0.5px solid #222">
    <div id="feed"></div>

    <script>
        const CORRECT_HASH = "a60786a3cbf7603733575d98e7c4428a";

        function post() {
            const pass = document.getElementById('pw').value;
            const text = document.getElementById('msg').value;
            const file = document.getElementById('file').files[0];
            
            if(!pass || !text || !file) return alert("全部入力してね");

            const inputHash = CryptoJS.MD5(pass).toString();
            if(inputHash !== CORRECT_HASH) return alert("パス不一致");

            const reader = new FileReader();
            reader.onload = (e) => {
                const base64 = e.target.result.split(',')[1];
                const post = document.createElement('div');
                post.className = 'post';
                post.innerHTML = `<div>${text}</div><div style="font-size:12px;color:#666;">${new Date().toLocaleString()}</div><img src="data:image/jpeg;base64,${base64}">`;
                document.getElementById('feed').prepend(post);
                document.getElementById('pw').value = '';
                document.getElementById('msg').value = '';
                document.getElementById('file').value = '';
                alert("投稿しました！");
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('msg').addEventListener('keydown', function(e) {
            if(e.ctrlKey && e.key === 'Enter') post();
        });
    </script>
</body>
</html>
