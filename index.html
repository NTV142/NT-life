<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NT-X System</title>
    <style>
        body { background:#000; color:#fff; font-family:sans-serif; max-width:500px; margin:0 auto; padding:10px; }
        input, textarea, button { width:100%; margin:5px 0; padding:12px; border-radius:8px; border:1px solid #333; background:#111; color:#fff; box-sizing:border-box; }
        .post { border-bottom:1px solid #222; padding:15px; }
        img { width:100%; border-radius:12px; margin-top:8px; }
    </style>
</head>
<body>
    <div id="editor">
        <input type="password" id="pw" placeholder="Pass">
        <textarea id="msg" placeholder="いまどうしてる？"></textarea>
        <input type="file" id="file" accept="image/*">
        <button onclick="post()">投稿する</button>
    </div>
    <hr style="border:0.5px solid #222">
    <div id="feed"></div>

    <script>
        const REPO = "ユーザー名/リポジトリ名"; // ★変更
        const GAS_URL = "GASのウェブアプリURL"; // ★変更

        async function post() {
            const pass = document.getElementById('pw').value;
            const text = document.getElementById('msg').value;
            const file = document.getElementById('file').files[0];
            if(!pass || !text || !file) return alert("全部入力してね");

            // 1. GASにパスワードを投げ、トークンを貰う
            const token = await fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({pass: pass})
            }).then(r => r.text());

            if(token === "error") return alert("パス不一致");

            // 2. 画像をBase64化してGitHubへ送信
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result.split(',')[1];
                const data = btoa(unescape(encodeURIComponent(JSON.stringify({
                    text: text, image: base64, date: new Date().toLocaleString()
                }))));

                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data/${Date.now()}.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}` },
                    body: JSON.stringify({ message: "post", content: data })
                });
                if(res.ok) location.reload();
            };
            reader.readAsDataURL(file);
        }

        async function load() {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data`);
            const files = await res.json();
            for(const f of files.reverse()) {
                const d = await (await fetch(f.download_url)).json();
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `<div>${d.text}</div><img src="data:image/png;base64,${d.image}">`;
                document.getElementById('feed').appendChild(div);
            }
        }
        load();
    </script>
</body>
</html>
